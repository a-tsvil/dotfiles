# Charcoal Orange lock screen. Authentication uses the existing PAM defaults.
general {
    hide_cursor = true
}

background {
    path = screenshot
    blur_passes = 2
    blur_size = 6
    brightness = 0.35
    vibrancy = 0.0
}

label {
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ff6a00ff)
    font_family = JetBrains Mono
    font_size = 64
    position = 0, 150
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A, %d.%m.%Y"
    color = rgba(c9c8c3ff)
    font_family = JetBrains Mono
    font_size = 16
    position = 0, 82
    halign = center
    valign = center
}

input-field {
    size = 360, 56
    outline_thickness = 2
    outer_color = rgba(e66000ff)
    inner_color = rgba(0a0b0bee)
    font_color = rgba(ff6a00ff)
    font_family = JetBrains Mono
    placeholder_text = <span foreground="##777770">Password</span>
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    rounding = 3
    fade_on_empty = false
    check_color = rgba(d49a32ff)
    fail_color = rgba(e05243ff)
    capslock_color = rgba(d49a32ff)
    position = 0, -24
    halign = center
    valign = center
}

label {
    text = Type your password to unlock
    color = rgba(777770ff)
    font_family = JetBrains Mono
    font_size = 12
    position = 0, -96
    halign = center
    valign = center
}
